name: CI

on:
  pull_request:
    branches: [v1.x]
  push:
    branches: [v1.x, ci-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bread-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Commit and formatting checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve introduced range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD^; fi
          echo "BREAD_CI_BASE=$base" >> "$GITHUB_ENV"
      - name: Test change-range checker
        run: python -m unittest discover -s util/ci/tests -v
      - name: Check introduced commit subjects
        run: python util/ci/check_changes.py commits --base "$BREAD_CI_BASE"
      - name: Check changed C and C++ lines
        run: python util/ci/check_changes.py format --base "$BREAD_CI_BASE"
  windows:
    name: Windows runtime and native settings
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Restore sealed offline build environment
        shell: pwsh
        run: ./replaylab/packaging/Restore-BuildEnvironment.ps1
      - name: Verify public capabilities inventory
        shell: pwsh
        run: |
          $inputs = Get-Content ./replaylab/output/build-inputs/paths.json -Raw | ConvertFrom-Json
          & ./replaylab/output/build-inputs/environment/Scripts/python.exe replaylab/packaging/prepare_capabilities_bundle.py --output $inputs.capabilities --public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows processes, configuration and subscriptions
        shell: pwsh
        run: |
          & ./replaylab/output/build-inputs/environment/Scripts/python.exe -m pytest replaylab/tests/test_ai_configuration_native.py replaylab/tests/test_codex_startup_diagnostic.py replaylab/tests/test_codex_jsonl_transport.py replaylab/tests/test_process_env_resolution.py replaylab/tests/test_process_env.py replaylab/tests/test_agent_diagnostics.py replaylab/tests/test_cli_start_gate.py replaylab/tests/test_cli_ai_config.py replaylab/tests/test_subscription.py replaylab/tests/test_acp_extensions.py replaylab/tests/test_acp_connection_boundaries.py replaylab/tests/test_agent_acp_session.py replaylab/tests/test_selftest.py replaylab/tests/test_native_vendor.py replaylab/tests/test_agent_standards.py replaylab/tests/test_agent_trace_native.py replaylab/tests/test_public_progress_security.py replaylab/tests/test_skills.py replaylab/tests/test_portable_capabilities.py replaylab/tests/test_task_mcp_proxy.py replaylab/packaging/tests -q --junitxml="$env:RUNNER_TEMP/bread-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test AI length recovery and context retention
        shell: pwsh
        run: |
          & ./replaylab/output/build-inputs/environment/Scripts/python.exe -m pytest replaylab/tests/test_context_management.py replaylab/tests/test_deepagents_framework_integration.py replaylab/tests/test_native_engine.py replaylab/tests/test_output_continuation.py replaylab/tests/test_task_input.py -q --junitxml="$env:RUNNER_TEMP/bread-length-recovery-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test live edit shutdown and integration compatibility
        shell: pwsh
        run: |
          & ./replaylab/output/build-inputs/environment/Scripts/python.exe -m pytest replaylab/mcp_host/tests/test_integration_manifest.py replaylab/mcp_host/tests/test_shader_live_edit.py replaylab/mcp_host/tests/test_shader_live_edit_lifecycle.py replaylab/mcp_host/tests/test_shader_save_capture_transition.py replaylab/mcp_host/tests/test_shader_scheduler.py replaylab/mcp_host/tests/test_server_frame_render_flow.py replaylab/mcp_host/tests/test_frame_flow_default_layout.py replaylab/mcp_host/tests/test_shader_workspace_panel.py replaylab/mcp_host/tests/test_unreal_validation.py replaylab/mcp_host/tests/test_unreal_restoration.py replaylab/mcp_host/tests/test_unreal_live_connection.py -q --junitxml="$env:RUNNER_TEMP/bread-mcp-tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-results
          path: |
            ${{ runner.temp }}/bread-tests.xml
            ${{ runner.temp }}/bread-mcp-tests.xml
            ${{ runner.temp }}/bread-length-recovery-tests.xml
